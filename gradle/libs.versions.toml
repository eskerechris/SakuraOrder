[versions]
paper-api = "1.21.11-R0.1-SNAPSHOT"
minecraft = "1.21.11"
run-task = "3.1.0"
hikari = "7.1.0"
sqlite = "3.53.4.0"
mysql = "26.7.0"
mariadb = "3.5.9"
vault = "1.7"
bstats = "3.2.1"
folialib = "0.5.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
vault = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
folialib = { module = "com.tcoded:FoliaLib", version.ref = "folialib" }

[bundles]
database = ["hikari", "sqlite", "mysql", "mariadb"]

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }