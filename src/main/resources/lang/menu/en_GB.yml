  cancel-button:
    name: "&cᴄᴀɴᴄᴇʟ"
    lore:
      - "&7Click to go back"

  confirm-button:
    name: "&aᴄᴏɴꜰɪʀᴍ"
    lore:
      - "&7(${earned})"

material-select-menu:
  title: "#FF8FB1ɴᴇᴡ ᴏʀᴅᴇʀ -> ꜱᴇʟᴇᴄᴛ ᴍᴀᴛᴇʀɪᴀʟ ({current_page}/{total_pages})"

  item-button:
    name: "#FF8FB1{material}"
    lore:
      - "&7Click to select"

enchant-select-menu:
  title: "#FF8FB1ᴘɪᴄᴋ ᴇɴᴄʜᴀɴᴛᴍᴇɴᴛꜱ"

  cancel-button:
    name: "&cᴄᴀɴᴄᴇʟ"
    lore:
      - " "

  confirm-button:
    name: "&aᴄᴏɴꜰɪʀᴍ"
    lore:
      - " "

  entry:
    name: "#FF8FB1{enchant}"
    selected-name: "&a{enchant}"
    lore:
      - "&7Click to select"
    lore-selected:
      - "&aꜱᴇʟᴇᴄᴛᴇᴅ"
      - "&7Click to remove"
    not-applicable: "&cɴᴏᴛ ᴀᴘᴘʟɪᴄᴀʙʟᴇ"

edit-order-menu:
  title: "#FF8FB1ʏᴏᴜʀ ᴏʀᴅᴇʀ -> ᴇᴅɪᴛ ᴏʀᴅᴇʀ"

  cancel-button:
    name: "&cᴄᴀɴᴄᴇʟ"
    lore:
      - "&fClick to cancel"

  collect-button:
    name: "#FF8FB1ᴄᴏʟʟᴇᴄᴛ"
    lore:
      - "&fClick to collect"

collect-menu:
